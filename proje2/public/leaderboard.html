    <div class="kategori-scroll-bar" id="kategoriScrollBar">
      <div class="kategori-item selected" data-value="overall" data-key="cat_overall">Genel</div>

    <div id="leaderboard"></div>
    <a class="main-menu-link" id="mainMenuBtn" style="cursor:pointer;" data-key="main_menu">Ana Menüye Dön</a>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const bar = document.getElementById('kategoriScrollBar');
      let selectedKategori = 'overall';
      bar.querySelectorAll('.kategori-item').forEach(function(item) {
        item.addEventListener('click', async function() {
          bar.querySelectorAll('.kategori-item').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');
          selectedKategori = item.getAttribute('data-value');
          const leaderboardDiv = document.getElementById('leaderboard');
          leaderboardDiv.classList.remove('fade-in');
          leaderboardDiv.classList.add('fade-out');
          setTimeout(() => {
            renderLeaderboard(exampleDataByCategory[selectedKategori] || [], selectedKategori);
            leaderboardDiv.classList.remove('fade-out');
            leaderboardDiv.classList.add('fade-in');
          }, 350);
        });
      });
      renderLeaderboard(exampleDataByCategory['overall'], 'overall');
      document.getElementById('leaderboard').classList.add('fade-in');
    });

    const exampleDataByCategory = {
      overall: [
        { username: 'ahmet', fullname: 'Ahmet Yılmaz', profilePic: 'image/Default_pfp.jpg', puan: 950 },

        { username: 'mert', fullname: 'Mert Aksoy', profilePic: 'image/Default_pfp.jpg', puan: 740 },
        { username: 'can', fullname: 'Can Polat', profilePic: 'image/Default_pfp.jpg', puan: 700 },

        { username: 'selin', fullname: 'Selin Yıldız', profilePic: 'image/Default_pfp.jpg', puan: 720 },
      ],
      Teknoloji: [
        { username: 'ahmet', fullname: 'Ahmet Yılmaz', profilePic: 'image/Default_pfp.jpg', puan: 500 },
        { username: 'ayse', fullname: 'Ayşe Demir', profilePic: 'image/Default_pfp.jpg', puan: 480 },
        { username: 'mehmet', fullname: 'Mehmet Kaya', profilePic: 'image/Default_pfp.jpg', puan: 470 },
      ],
      Sinema: [
        { username: 'zeynep', fullname: 'Zeynep Şahin', profilePic: 'image/Default_pfp.jpg', puan: 600 },

      ],
      Dil: [
        { username: 'selin', fullname: 'Selin Yıldız', profilePic: 'image/Default_pfp.jpg', puan: 400 },

      Zaman: [
        { username: 'ahmet', fullname: 'Ahmet Yılmaz', profilePic: 'image/Default_pfp.jpg', puan: 50 },
      ],
    };

    function renderLeaderboard(data, kategori) {
      data = [...data].sort((a, b) => (b.puan ?? b.toplam ?? 0) - (a.puan ?? a.toplam ?? 0));
      const leaderboardDiv = document.getElementById('leaderboard');
      let html = '';
      if (data.length === 0) {
        html = '<div>Henüz veri yok.</div>';
      } else {
        html += `<table style=\"width:100%;border-collapse:collapse;\">\n<tr><th style='text-align:left;'>#</th><th style='text-align:left;'>Kullanıcı</th><th>Puan</th></tr>`;
        data.forEach((u,i)=>{
          let kupa = '';
          if(i===0) kupa = '🥇';
          else if(i===1) kupa = '🥈';
          else if(i===2) kupa = '🥉';
          html += `<tr class='${i<3?"ilk3":""}'>\n<td>${kupa||i+1}</td>\n<td><img src=\"${u.profilePic||'image/Default_pfp.jpg'}\" style=\"width:32px;height:32px;border-radius:50%;vertical-align:middle;margin-right:8px;\">${u.fullname||u.username}</td>\n<td>${u.puan!==undefined?u.puan:u.toplam}</td>\n</tr>`;
        });
        html += '</table>';
      }
      leaderboardDiv.innerHTML = html;
    }

    document.getElementById('mainMenuBtn').onclick = function(e) {
      e.preventDefault();
      if (typeof animatedRedirect === 'function') {
        animatedRedirect('anasayfa.html');
      } else {
        window.location.href = 'anasayfa.html';
      }
    };
